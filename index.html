<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospetto spese</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6df6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--bd:#e1e4e8;--ac:#2f6df6;--ok:#1a9d5a;--warn:#d98a00;--bad:#d83a3a;--row:#fafbfc;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mut:#8b94a1;--bd:#2a313b;--ac:#6b9bff;--ok:#3ccf87;--warn:#f0b13a;--bad:#ff6b6b;--row:#171c22;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.card small{color:var(--mut);display:block}
.card b{font-size:21px;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--mut)}
.card.hl{border-color:var(--ac)}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;color:var(--mut);text-align:left;font-weight:600;padding:6px 6px}
td{padding:4px 6px;border-top:1px solid var(--bd);vertical-align:middle}
td input,td select{width:100%;padding:5px 7px;border-color:transparent;background:transparent}
td input:focus,td select:focus{border-color:var(--ac);background:var(--card)}
td input.nt{font-size:12px;color:var(--mut);padding-top:0}
td.n input{text-align:right;font-variant-numeric:tabular-nums}
tr.paid td:not(.ck):not(.x){opacity:.5}
tr.paid input.nm{text-decoration:line-through}
.chip{font-size:11px;padding:2px 7px;border-radius:10px;white-space:nowrap}
.late{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.soon{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.okc{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.ck input{width:20px;height:20px;accent-color:var(--ok)}
.x button{border:none;background:none;color:var(--mut);padding:2px 6px}
.add{display:grid;grid-template-columns:130px 1fr 110px 150px auto;gap:6px}
@media(max-width:640px){.add{grid-template-columns:1fr 1fr}}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.foot{color:var(--mut);font-size:12px;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.add4{grid-template-columns:130px 1fr 110px auto}
.dad{display:grid;grid-template-columns:1fr 130px 110px 140px auto;gap:6px}
@media(max-width:640px){.add4{grid-template-columns:1fr 1fr}.dad{grid-template-columns:1fr 1fr}}
.dc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.dc.done{opacity:.55}
.dr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dr label{font-size:12px;color:var(--mut)}
.dr input,.dr select{width:auto;min-width:0}
.dc .nm{font-weight:600;flex:1;min-width:120px}
.dc .pa{width:110px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:8px}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-top:1px solid var(--bd)}
.dg{margin-bottom:12px}
.dg>summary.gh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 2px;font-size:15px;color:var(--tx);margin-top:0}
.pl button{border:none;background:none;color:var(--mut);padding:0 4px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>💶 Prospetto spese</h1>
  <div class="bar" id="mnav">
    <button id="prev" title="Mese precedente">‹</button>
    <select id="mon"></select>
    <button id="next" title="Mese successivo">›</button>
    <button id="newm" class="pri" title="Crea il mese successivo copiando le voci">＋ Nuovo mese</button>
  </div>
</header>
<nav class="tabs" id="tabs"><button data-t="m" class="on">Mensile</button><button data-t="a">Annuali</button><button data-t="d">Debiti e crediti</button></nav>
<div id="v-m">

<div class="cards" id="cards"></div>

<div class="panel">
  <div class="add">
    <input type="date" id="a-d">
    <input type="text" id="a-n" placeholder="Nuova voce (es. Bolletta luce)">
    <input type="number" id="a-a" step="0.01" min="0" placeholder="Importo €">
    <select id="a-s"><option value="m">Conto principale</option><option value="r">Via Revolut</option></select>
    <button id="a-b" class="pri">Aggiungi</button>
  </div>
</div>

<div class="bar seg" style="margin-bottom:8px">
  <button data-f="all" class="on">Tutte</button>
  <button data-f="todo">Da pagare</button>
  <button data-f="done">Pagate</button>
</div>

<div class="panel tw">
<table>
  <thead><tr><th style="width:118px">Scadenza</th><th>Oggetto</th><th style="width:110px;text-align:right">Importo</th><th style="width:150px">Si paga da</th><th style="width:90px">Stato</th><th style="width:44px">Pagato</th><th style="width:34px"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>

</div>

<div id="v-a" style="display:none">
  <div class="bar" style="justify-content:center;margin-bottom:12px"><button id="ay-p">‹</button><b id="ay" style="font-size:18px"></b><button id="ay-n">›</button></div>
  <div class="cards" id="acards"></div>
  <div class="panel"><div class="add add4">
    <input type="date" id="aa-d"><input type="text" id="aa-n" placeholder="Nuova scadenza annuale (es. Bollo auto)"><input type="number" id="aa-a" step="0.01" min="0" placeholder="Importo €"><button id="aa-b" class="pri">Aggiungi</button>
  </div><p class="foot" style="margin:6px 0 0">Conta solo giorno e mese: la scadenza si ripete ogni anno e lo stato “pagato” è separato per anno.</p></div>
  <div class="panel tw"><table style="min-width:520px">
    <thead><tr><th style="width:130px">Scadenza</th><th>Oggetto</th><th style="width:110px;text-align:right">Importo</th><th style="width:100px">Stato</th><th style="width:44px">Pagato</th><th style="width:34px"></th></tr></thead>
    <tbody id="arows"></tbody></table></div>
</div>

<div id="v-d" style="display:none">
  <div class="cards" id="dcards"></div>
  <div class="panel"><div class="dad">
    <input type="text" id="dd-w" list="dwho" placeholder="Persona / ente">
    <select id="dd-t"><option value="d">Devo io</option><option value="c">Mi devono</option></select>
    <input type="number" id="dd-a" step="0.01" min="0" placeholder="Totale €">
    <input type="date" id="dd-d" title="Scadenza (facoltativa)">
    <button id="dd-b" class="pri">Aggiungi</button>
  </div></div>
  <datalist id="dwho"></datalist>
  <div id="dlist"></div>
</div>

<div class="bar" style="justify-content:center;margin-bottom:10px">
  <button id="exp">⬇ Esporta backup</button>
  <button id="imp">⬆ Importa backup</button>
  <input type="file" id="file" accept=".json" hidden>
</div>
<p class="foot">I dati restano salvati in questo browser. Esporta un backup ogni tanto.</p>
</div>

<script>
const KEY='prospetto-spese-v1';
const SEED=[[1,'Netflix',0,'m'],[8,'Rata modem',5.65,'m'],[10,'Tim bolletta',29.9,'m'],[10,'Nikola',100,'m'],[10,'Spesa',100,'m'],[10,'Fondo Emergenze',0,'m'],[10,'Viaggi',0,'m'],[10,'Investimenti',100,'m'],[10,'Spotify',3.5,'r'],[10,'Ass benessere 7',6.2,'r'],[10,'Ass benessere 11',10.5,'r'],[10,'Assicurazione vita',12.4,'r'],[10,'Spese condominiali',20,'r'],[10,'Bollo',25,'r'],[10,'Pneumatici',42.5,'r'],[10,'Tagliando',50,'r'],[10,'IMU',71.5,'r'],[10,'Assicurazione macchina',87.25,'r'],[10,'Dolly',150,'r'],[10,'Snowball',165,'r'],[10,'Dichiarazione dei redditi',190,'r'],[10,'Debito mamma',51.12,'r'],[12,'Unipol Move',48.3,'m'],[12,'Parrucchiere',20,'m'],[12,'Rata iPhone',137.5,'m'],[18,'Habits',1.99,'m'],[20,'Ricarica',9.99,'m'],[20,'iCloud',9.99,'m'],[22,'Rata modem Wind',8.99,'m'],[30,'Rata condizionatore',134.62,'m'],[31,'Mutuo',405.79,'m']];
const SEED11=[[1,'Netflix',0,'m',1],[8,'Rata modem',5.65,'m',1],[10,'Tim bolletta',32.89,'m',1],[10,'Nikola',100,'m',1],[10,'Spesa',100,'m'],[10,'Fondo Emergenze',0,'m',1],[10,'Viaggi',0,'m',1],[10,'Investimenti',100,'m'],[10,'Spotify',3.5,'r',1],[10,'Ass benessere 7',6.2,'r',1],[10,'Ass benessere 11',10.5,'r',1],[10,'Assicurazione vita',12.4,'r',1],[10,'Spese condominiali',20,'r',1],[10,'Bollo',25,'r',1],[10,'Pneumatici',42.5,'r',1],[10,'Tagliando',50,'r',1],[10,'IMU',71.5,'r',1],[10,'Assicurazione macchina',87.25,'r',1],[10,'Dolly',150,'r',1],[10,'Snowball',165,'r',1],[10,'Dichiarazione dei redditi',190,'r',1],[10,'Debito mamma',51.12,'r',1],[12,'Unipol Move',48.3,'m',1],[12,'Parrucchiere',20,'m'],[12,'Rata iPhone',137.5,'m',1],[18,'Habits',1.99,'m'],[20,'Ricarica',9.99,'m'],[20,'iCloud',9.99,'m'],[22,'Rata modem Wind',8.99,'m'],[30,'Rata condizionatore',134.62,'m'],[31,'Mutuo',405.79,'m']];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const r2=n=>Math.round(n*100)/100;
let S=null,flt='all';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const mk=(k,L)=>L.map(([d,n,a,s,p])=>({id:uid(),date:k+'-'+pad(d),name:n,amount:a,src:s,paid:!!p,note:''}));
if(!S||!S.months)S={cur:'2026-11',months:{}};
if(!S.months['2026-11'])S.months['2026-11']=mk('2026-11',SEED11);
if(!S.months['2026-12'])S.months['2026-12']=mk('2026-12',SEED);
S.annual=S.annual||[];S.debts=S.debts||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const monthLabel=k=>{const[y,m]=k.split('-');const s=new Date(+y,m-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const items=()=>S.months[S.cur];

function render(){
  const keys=Object.keys(S.months).sort();
  $('mon').innerHTML=keys.map(k=>`<option value="${k}"${k===S.cur?' selected':''}>${monthLabel(k)}</option>`).join('');
  const t=new Date(),today=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  const all=[...items()].sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
  const sum=f=>r2(all.filter(f).reduce((s,i)=>s+(+i.amount||0),0));
  const tot=sum(()=>1),paid=sum(i=>i.paid),left=sum(i=>!i.paid);
  const lm=sum(i=>!i.paid&&i.src==='m'),lr=sum(i=>!i.paid&&i.src==='r');
  const tm=sum(i=>i.src==='m'),tr=sum(i=>i.src==='r');
  const nLeft=all.filter(i=>!i.paid&&i.amount>0).length;
  const late=sum(i=>!i.paid&&i.date<today);
  const next=all.find(i=>!i.paid&&i.amount>0&&i.date>=today);
  const pct=tot?Math.round(paid/tot*100):0;
  $('cards').innerHTML=
   `<div class="card"><small>Totale del mese</small><b>${eur(tot)}</b><span class="s">${all.length} voci</span></div>
    <div class="card"><small>Già pagato</small><b style="color:var(--ok)">${eur(paid)}</b><div class="prog"><i style="width:${pct}%"></i></div><span class="s">${pct}% completato</span></div>
    <div class="card hl"><small>Resta da pagare</small><b>${eur(left)}</b><span class="s">${nLeft} scadenze${late>0?` · <span style="color:var(--bad)">${eur(late)} scaduti</span>`:''}</span></div>
    <div class="card hl"><small>Da pagare dal conto principale</small><b>${eur(lm)}</b><span class="s">su ${eur(tm)} nel mese</span></div>
    <div class="card hl"><small>Da trasferire a Revolut</small><b>${eur(lr)}</b><span class="s">su ${eur(tr)} nel mese</span></div>
    <div class="card"><small>Uscita totale dal conto principale</small><b>${eur(lm+lr)}</b><span class="s">pagamenti diretti + trasferimento</span></div>
    <div class="card"><small>Prossima scadenza</small><b style="font-size:16px">${next?esc(next.name):'—'}</b><span class="s">${next?new Date(next.date).toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' · '+eur(next.amount):'nessuna'}</span></div>`;
  const vis=all.filter(i=>flt==='all'||(flt==='todo'?!i.paid:i.paid));
  $('rows').innerHTML=vis.map(i=>{
    let c='';
    if(i.paid)c='<span class="chip okc">Pagato</span>';
    else if(i.amount>0){const d=Math.round((new Date(i.date)-new Date(today))/864e5);
      if(d<0)c='<span class="chip late">Scaduto</span>';else if(d<=3)c='<span class="chip soon">'+(d===0?'Oggi':'tra '+d+' gg')+'</span>';}
    return `<tr data-id="${i.id}" class="${i.paid?'paid':''}">
      <td><input type="date" data-k="date" value="${i.date}"></td>
      <td><input class="nm" data-k="name" value="${esc(i.name)}"><input class="nt" data-k="note" placeholder="nota" value="${esc(i.note)}"></td>
      <td class="n"><input type="number" step="0.01" min="0" data-k="amount" value="${i.amount}"></td>
      <td><select data-k="src"><option value="m"${i.src==='m'?' selected':''}>Conto principale</option><option value="r"${i.src==='r'?' selected':''}>Via Revolut</option></select></td>
      <td>${c}</td>
      <td class="ck"><input type="checkbox" data-k="paid"${i.paid?' checked':''}></td>
      <td class="x"><button data-del title="Elimina">✕</button></td></tr>`}).join('')||'<tr><td colspan="7" style="color:var(--mut);text-align:center;padding:18px">Nessuna voce</td></tr>';
  rA();rD();save();
}

$('rows').addEventListener('change',e=>{
  const tr=e.target.closest('tr'),k=e.target.dataset.k;if(!tr||!k)return;
  const it=items().find(x=>x.id===tr.dataset.id);if(!it)return;
  it[k]=k==='paid'?e.target.checked:k==='amount'?(parseFloat(e.target.value)||0):e.target.value;
  if(k==='date'&&!e.target.value)it.date=S.cur+'-01';
  render();
});
$('rows').addEventListener('click',e=>{
  if(!e.target.closest('[data-del]'))return;
  const id=e.target.closest('tr').dataset.id,it=items().find(x=>x.id===id);
  if(confirm('Eliminare “'+it.name+'”?')){S.months[S.cur]=items().filter(x=>x.id!==id);render()}
});
document.querySelector('.seg').addEventListener('click',e=>{
  const f=e.target.dataset.f;if(!f)return;flt=f;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));render();
});
$('mon').onchange=e=>{S.cur=e.target.value;render()};
const step=d=>{const k=Object.keys(S.months).sort(),i=k.indexOf(S.cur)+d;if(k[i]){S.cur=k[i];render()}};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('newm').onclick=()=>{
  const[y,m]=S.cur.split('-').map(Number),ny=m===12?y+1:y,nm=m===12?1:m+1,k=ny+'-'+pad(nm);
  if(!S.months[k]){
    const len=new Date(ny,nm,0).getDate();
    S.months[k]=items().map(i=>({...i,id:uid(),paid:false,date:k+'-'+pad(Math.min(+i.date.slice(8),len))}));
  }
  S.cur=k;render();
};
$('a-d').value=S.cur+'-10';
$('a-b').onclick=()=>{
  const n=$('a-n').value.trim();if(!n){$('a-n').focus();return}
  items().push({id:uid(),date:$('a-d').value||S.cur+'-01',name:n,amount:parseFloat($('a-a').value)||0,src:$('a-s').value,paid:false,note:''});
  $('a-n').value='';$('a-a').value='';render();
};
$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='prospetto_spese_backup.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.months||!d.cur)throw 0;
    if(confirm('Sostituire i dati attuali con il backup?')){S=d;S.annual=S.annual||[];S.debts=S.debts||[];render()}}catch(x){alert('File non valido')}};
  r.readAsText(f);e.target.value='';
};

const tdy=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
let ay=new Date().getFullYear();
function setTab(t){['m','a','d'].forEach(k=>{$('v-'+k).style.display=k===t?'':'none'});$('mnav').style.display=t==='m'?'':'none';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
$('tabs').onclick=e=>{if(e.target.dataset.t)setTab(e.target.dataset.t)};
const fd=d=>new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});

/* ---- Scadenze annuali ---- */
const adate=(a,y)=>y+'-'+pad(a.m)+'-'+pad(Math.min(a.d,new Date(y,a.m,0).getDate()));
function chip(p,amt,dt,t){if(p)return '<span class="chip okc">Pagato</span>';if(!(amt>0))return '';const d=Math.round((new Date(dt)-new Date(t))/864e5);return d<0?'<span class="chip late">Scaduto</span>':d<=7?'<span class="chip soon">'+(d===0?'Oggi':'tra '+d+' gg')+'</span>':''}
function rA(){
  $('ay').textContent=ay;const t=tdy();
  const L=S.annual.map(a=>({a,dt:adate(a,ay),p:!!(a.paid&&a.paid[ay])})).sort((x,y)=>x.dt.localeCompare(y.dt)||x.a.name.localeCompare(y.a.name));
  const sm=f=>r2(L.filter(f).reduce((s,x)=>s+(+x.a.amount||0),0));
  const tot=sm(()=>1),pd=sm(x=>x.p),left=r2(tot-pd),late=sm(x=>!x.p&&x.dt<t),n=L.filter(x=>!x.p&&x.a.amount>0).length;
  const nx=L.find(x=>!x.p&&x.a.amount>0&&x.dt>=t);
  $('acards').innerHTML=`<div class="card"><small>Totale ${ay}</small><b>${eur(tot)}</b><span class="s">${L.length} scadenze</span></div>
   <div class="card"><small>Già pagato</small><b style="color:var(--ok)">${eur(pd)}</b></div>
   <div class="card hl"><small>Resta da pagare</small><b>${eur(left)}</b><span class="s">${n} scadenze${late>0?` · <span class="neg">${eur(late)} scaduti</span>`:''}</span></div>
   <div class="card"><small>Da accantonare al mese</small><b>${eur(tot/12)}</b><span class="s">totale annuo ÷ 12</span></div>
   <div class="card"><small>Prossima scadenza</small><b style="font-size:16px">${nx?esc(nx.a.name):'—'}</b><span class="s">${nx?new Date(nx.dt).toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' · '+eur(nx.a.amount):'nessuna'}</span></div>`;
  $('arows').innerHTML=L.map(({a,dt,p})=>`<tr data-id="${a.id}" class="${p?'paid':''}">
    <td><input type="date" data-k="date" value="${dt}"></td>
    <td><input class="nm" data-k="name" value="${esc(a.name)}"></td>
    <td class="n"><input type="number" step="0.01" min="0" data-k="amount" value="${a.amount}"></td>
    <td>${chip(p,a.amount,dt,t)}</td>
    <td class="ck"><input type="checkbox" data-k="paid"${p?' checked':''}></td>
    <td class="x"><button data-del title="Elimina">✕</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mut);text-align:center;padding:18px">Nessuna scadenza annuale: aggiungi la prima qui sopra</td></tr>';
}
$('ay-p').onclick=()=>{ay--;rA()};$('ay-n').onclick=()=>{ay++;rA()};
$('aa-d').value=ay+'-01-01';
$('aa-b').onclick=()=>{
  const n=$('aa-n').value.trim();if(!n){$('aa-n').focus();return}
  const v=$('aa-d').value||ay+'-01-01';
  S.annual.push({id:uid(),name:n,m:+v.slice(5,7),d:+v.slice(8,10),amount:parseFloat($('aa-a').value)||0,paid:{}});
  $('aa-n').value='';$('aa-a').value='';render();
};
$('arows').addEventListener('change',e=>{
  const tr=e.target.closest('tr'),k=e.target.dataset.k;if(!tr||!k)return;
  const a=S.annual.find(x=>x.id===tr.dataset.id);if(!a)return;
  if(k==='paid'){a.paid=a.paid||{};a.paid[ay]=e.target.checked}
  else if(k==='date'){const v=e.target.value;if(v){a.m=+v.slice(5,7);a.d=+v.slice(8,10)}}
  else a[k]=k==='amount'?(parseFloat(e.target.value)||0):e.target.value;
  render();
});
$('arows').addEventListener('click',e=>{
  if(!e.target.closest('[data-del]'))return;
  const id=e.target.closest('tr').dataset.id,a=S.annual.find(x=>x.id===id);
  if(confirm('Eliminare “'+a.name+'” da tutti gli anni?')){S.annual=S.annual.filter(x=>x.id!==id);render()}
});

/* ---- Debiti e crediti ---- */
const paidOf=x=>r2(x.pay.reduce((s,p)=>s+p.a,0)),remOf=x=>r2(x.total-paidOf(x));
const gclosed=new Set();
function rD(){
  const t=tdy(),open=S.debts.filter(x=>remOf(x)>0.004);
  const sd=r2(open.filter(x=>x.dir==='d').reduce((s,x)=>s+remOf(x),0)),sc=r2(open.filter(x=>x.dir==='c').reduce((s,x)=>s+remOf(x),0));
  const net=r2(sc-sd);
  $('dcards').innerHTML=`<div class="card hl"><small>Devo ancora</small><b class="neg">${eur(sd)}</b><span class="s">${open.filter(x=>x.dir==='d').length} debiti aperti</span></div>
   <div class="card hl"><small>Mi devono ancora</small><b class="pos">${eur(sc)}</b><span class="s">${open.filter(x=>x.dir==='c').length} crediti aperti</span></div>
   <div class="card"><small>Saldo netto</small><b class="${net>=0?'pos':'neg'}">${eur(net)}</b><span class="s">${net>=0?'a tuo favore':'a tuo carico'}</span></div>`;
  const L=[...S.debts].sort((a,b)=>(remOf(a)<=0.004)-(remOf(b)<=0.004)||a.dir.localeCompare(b.dir)||remOf(b)-remOf(a));
  const dRow=x=>{
    const rem=remOf(x),pd=paidOf(x),done=rem<=0.004,pct=x.total>0?Math.min(100,Math.round(pd/x.total*100)):0,deb=x.dir==='d';
    const late=!done&&x.due&&x.due<t;
    return `<div class="dc${done?' done':''}" data-id="${x.id}">
      <div class="dr" style="margin:0"><input class="nm" data-k="who" list="dwho" value="${esc(x.who)}">
        <select data-k="dir"><option value="d"${deb?' selected':''}>Devo io</option><option value="c"${deb?'':' selected'}>Mi devono</option></select>
        ${done?'<span class="chip okc">Saldato</span>':late?'<span class="chip late">Scaduto</span>':''}
        <button data-del title="Elimina" style="border:none;background:none;color:var(--mut)">✕</button></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="s" style="font-size:13px;margin-top:4px">${deb?'Restituito':'Incassato'} <b>${eur(pd)}</b> di ${eur(x.total)} · resta <b class="${deb?'neg':'pos'}">${eur(Math.max(rem,0))}</b></div>
      <div class="dr"><label>Totale</label><input type="number" step="0.01" min="0" data-k="total" value="${x.total}" style="width:100px">
        <label>Scadenza</label><input type="date" data-k="due" value="${x.due||''}">
        <input data-k="note" placeholder="nota" value="${esc(x.note)}" style="flex:1;min-width:100px"></div>
      ${done?'':`<div class="dr"><input type="number" class="pa" step="0.01" min="0" placeholder="Importo €"><button data-addp class="pri">${deb?'Registra pagamento':'Registra incasso'}</button><button data-all>Salda tutto</button></div>`}
      ${x.pay.length?`<details><summary>Movimenti (${x.pay.length})</summary>${x.pay.map(p=>`<div class="pl" data-pid="${p.id}"><span>${fd(p.date)}</span><span>${eur(p.a)}<button data-delp title="Elimina">✕</button></span></div>`).join('')}</details>`:''}
    </div>`};
  const G=new Map();
  L.forEach(x=>{const k=x.who.trim().toLowerCase();if(!G.has(k))G.set(k,{k,name:x.who.trim()||'(senza nome)',rows:[]});G.get(k).rows.push(x)});
  const gs=[...G.values()].map(g=>{const o=g.rows.filter(x=>remOf(x)>0.004);g.d=r2(o.filter(x=>x.dir==='d').reduce((a,x)=>a+remOf(x),0));g.c=r2(o.filter(x=>x.dir==='c').reduce((a,x)=>a+remOf(x),0));g.open=o.length;return g}).sort((a,b)=>(!a.open)-(!b.open)||(b.d+b.c)-(a.d+a.c)||a.name.localeCompare(b.name));
  $('dwho').innerHTML=[...new Set(S.debts.map(x=>x.who.trim()).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('');
  $('dlist').innerHTML=gs.map(g=>`<details class="dg" data-g="${esc(g.k)}"${gclosed.has(g.k)?'':' open'}><summary class="gh"><b>${esc(g.name)}</b>${g.d>0?` <span class="chip late">Devo ${eur(g.d)}</span>`:''}${g.c>0?` <span class="chip okc">Mi devono ${eur(g.c)}</span>`:''}${g.d>0&&g.c>0?` <span class="s">netto ${eur(g.c-g.d)}</span>`:''}${g.open?'':' <span class="chip okc">Saldato</span>'}<span class="s"> · ${g.rows.length} ${g.rows.length===1?'riga':'righe'}</span></summary>${g.rows.map(dRow).join('')}</details>`).join('')||'<p class="foot" style="padding:18px">Nessun debito o credito: aggiungine uno qui sopra</p>';
}
$('dlist').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.g!==undefined){d.open?gclosed.delete(d.dataset.g):gclosed.add(d.dataset.g)}},true);
$('dd-b').onclick=()=>{
  const w=$('dd-w').value.trim();if(!w){$('dd-w').focus();return}
  S.debts.push({id:uid(),who:w,dir:$('dd-t').value,total:parseFloat($('dd-a').value)||0,due:$('dd-d').value,note:'',pay:[]});
  $('dd-w').value='';$('dd-a').value='';$('dd-d').value='';render();
};
$('dlist').addEventListener('change',e=>{
  const c=e.target.closest('.dc'),k=e.target.dataset.k;if(!c||!k)return;
  const x=S.debts.find(y=>y.id===c.dataset.id);if(!x)return;
  x[k]=k==='total'?(parseFloat(e.target.value)||0):e.target.value;render();
});
$('dlist').addEventListener('click',e=>{
  const c=e.target.closest('.dc');if(!c)return;
  const x=S.debts.find(y=>y.id===c.dataset.id),T=e.target;if(!x)return;
  if(T.closest('[data-del]')){if(confirm('Eliminare “'+x.who+'” con tutti i movimenti?')){S.debts=S.debts.filter(y=>y!==x);render()}}
  else if(T.closest('[data-delp]')){const id=T.closest('.pl').dataset.pid;x.pay=x.pay.filter(p=>p.id!==id);render()}
  else if(T.closest('[data-addp]')){const v=parseFloat(c.querySelector('.pa').value);if(v>0){x.pay.push({id:uid(),date:tdy(),a:v});render()}else c.querySelector('.pa').focus()}
  else if(T.closest('[data-all]')){const r=remOf(x);if(r>0){x.pay.push({id:uid(),date:tdy(),a:r});render()}}
});
setTab('m');
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
